<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PRTS Omni bridge">
  <!-- 原创图标：左侧手机（PRTS Omni 客户端）经令牌校验的通道连到右侧 Host 方块 -->
  <rect x="2" y="12" width="26" height="40" rx="5" fill="#1f6f8b"/>
  <rect x="6" y="17" width="18" height="26" rx="2" fill="#eaf6fa"/>
  <rect x="11" y="46" width="8" height="2.4" rx="1.2" fill="#eaf6fa"/>
  <!-- 通道 -->
  <path d="M30 32 H40" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="35" cy="32" r="3.4" fill="#f2a541" stroke="#1f6f8b" stroke-width="1.6"/>
  <!-- Host 侧 -->
  <rect x="41" y="14" width="21" height="36" rx="4" fill="#264653"/>
  <rect x="45" y="19" width="13" height="4" rx="1.6" fill="#8ecae6"/>
  <rect x="45" y="27" width="13" height="4" rx="1.6" fill="#8ecae6"/>
  <rect x="45" y="35" width="13" height="4" rx="1.6" fill="#8ecae6"/>
  <rect x="45" y="43" width="6" height="3" rx="1.5" fill="#f2a541"/>
</svg>
