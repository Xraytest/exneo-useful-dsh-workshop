# ── 管理员权限通道（dsh-admin-channel）──────────────────────────────────────
# v11（2026-11-07 用户指令「制作一个插件允许在 dsh 启动时请求管理员权限提供给
# 会话，可选开启权限时不需要再弹窗」）：**启动授权**。
#   · DSH 一起来就弹**一次** UAC，拉起常驻提权进程（broker.ps1，同一套令牌 /
#     PID 校验 / 管道 ACL，不复制提权逻辑）；
#   · 之后任意会话在「工作箱」拨开关 = 挂载到该进程，**不再弹窗**；
#   · 会话拨关 / 会话销毁 = 只摘挂载，常驻进程继续为其它会话服务；
#   · 用户点了「否」= 本次进程内 declined，不再自动追问，会话退回自建通道；
#   · 提权进程不可能比 DSH 宿主活得更久（它只服务一个管道客户端，host 断开即退）。
#   把 startupConsent 设为 false 即整体关闭该特性，回到「每会话拨开关才弹一次」。
#
# v9（2026-11-07 用户指令「去除隧道提权时间限制」）：时长项每一项都支持
#   0 = 不限时，且**默认值就是 0**。想恢复某个上限，把它改回正数即可。
#   不限时不等于无边界：cancel 文件 / spec 删除 / ownerPid 消失 / 管道断开
#   仍会让提权进程退出。
# v10（同日自审修正）：execTimeoutMs / maxExecTimeoutMs 的可配置上限放宽到 24h，
#   与 broker 侧一致；模型传入的超大 timeout_ms（>24h）按不限时处理，避免被 Node
#   计时器静默夹成 1ms 而误杀命令并连带关通道。
#
# 本行只插本插件自己；工作箱里的那一行在 dsh-workbench 的 ACTIONS 表里
# （route = /dsh-admin-channel/action，status = /dsh-admin-channel/status）。
- insert:
    - id: admin-channel
      name: './entry-v11.js'
      config:
        # 启动授权总开关：DSH 启动时请求一次 UAC 建立常驻提权进程，供所有会话
        # 挂载（默认开 = 不写 also 即为 true）。false = 回到「会话拨开关才弹一次」。
        startupConsent: true
        # UAC 授权等待上限（毫秒）：0 = 一直等用户点「是」（默认）。
        uacTimeoutMs: 0
        # 空闲自动关闭（毫秒）：最后一次 admin_exec 之后多久关闭提权进程。
        # 0 = 不因闲置自动关闭（默认）。注意：常驻授权上只要还有会话挂载就不算
        # 空闲（到点重新计时），不会出现「共享进程被闲置策略偷偷关掉」。
        idleTimeoutMs: 0
        # 同时允许多少个会话各开一条**自建**通道；1 = 全局只允许一条。
        # 挂载在常驻授权上的会话不占这个额度（它们共用同一条进程）。
        maxChannels: 1
        # admin_exec 单条命令的默认超时（毫秒）：0 = 命令可跑任意久（默认）。
        execTimeoutMs: 0
        # 模型显式传 timeout_ms 时的上限（毫秒）：0 = 不设上限（默认）。
        maxExecTimeoutMs: 0
        # 单条命令 stdout / stderr 各自保留的字节上限（这不是时间限制）。
        maxOutputBytes: 262144
