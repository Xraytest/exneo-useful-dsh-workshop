<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 双智能指导（v4 合并版）：仍是两个圆头角色并立 —— 左侧实心=执行者（埋头做事的后台
       subagent），右侧描边+挑起的一撇=挑刺者（主上下文里只做判断与指派角度）。
       v4 在右下角加了一枚「程序核验」勾标（出处要被确定性代码核一遍才算数），
       对应合并进来的第二件事：子代理模型选择 + 出处核验。
       配色沿用宿主品牌色系（--dsw-alias-brand-primary 的近似值）。 -->
  <g fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 执行者：圆头 + 沉肩躬身的躯干 -->
    <circle cx="22" cy="20" r="9" fill="#3b82f6" stroke="none"/>
    <path d="M8 56c0-9.9 6.3-16 14-16s14 6.1 14 16"/>
    <!-- 挑刺者：圆头 + 抬臂指摘的躯干 -->
    <circle cx="44" cy="16" r="9"/>
    <path d="M32 56c0-8.8 5.4-14.6 12-14.6 3 0 5.7 1 7.8 2.8"/>
    <path d="M52 30l6-7"/>
  </g>
  <!-- 程序核验勾标：圆底 + 勾，压在右下角，表示「出处先过一遍确定性检查」 -->
  <g>
    <circle cx="50" cy="50" r="11" fill="#0f9d58" stroke="none"/>
    <path d="M44.5 50.5l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
