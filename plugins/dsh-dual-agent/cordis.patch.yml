# ── 双智能指导（dsh-dual-agent v4，工作区名沿用 dsh-dual-agent）────────────────
# v2（2026-10-29）：启动=武装待命；执行者=真 subagent；手动停止=回待命不挑刺。
# v3（2026-10-30）：双线阻塞修正——执行者 delivery:'caller'，结算由编排 await
#   activation.result 驱动，把「报告原文 + 评估指令」合成**恰一条**注入主上下文。
# v18（2026-10-30）：修「执行者已结束、前台仍执行中」——用「活的执行者 + 落盘记录」
#   自愈：接管活执行者、读回已结束执行者的报告、幽灵 running 收回待命。
# v19（2026-10-31）：修「子代理未正确产生 / 直接结束」——孵化前体检，系统性失败
#   只写 status note、不再制造错误回合。
# v20（2026-11-03，合并版）：更名「双智能指导」，一个开关总控三件事——
#   ① 双主智能编排（保留）；② 子代理模型链（合并自 dsh-subagent-models，孵化时
#   走官方 agentOptions，请求期改路由兜底，ctx.provide('subagentModels') 服务键不变，
#   dsh-model-pool 的用量重定向照旧生效）；③ 主智能只判断（根作用域 tools.guard
#   精确拒绝）+ 出处程序核验（报告里的 ⟦证据⟧ 块由确定性代码逐条核对，结果与报告
#   同条注入主上下文）。工作箱那一行**开关照旧**，另外多一个可进入的二级菜单
#   （GET/POST /dsh-dual-agent/menu：内容由本插件出，渲染由 dsh-workbench 做）。
#   ⚠ 本行插 host 半边；合并后请从 profile 补丁里移除旧的 subagent-models 行，
#     并把 plugins/dsh-subagent-models 目录移出 profile 的插件扫描目录（否则它的
#     会话头部面板与请求期改路由会与本插件重复作用）。
# v21（2026-11-05）：运行时设置按会话家族隔离——武装时刻从模板物化家族快照
#   （doc.families，STATE_VERSION 仍为 3），家族内改设置互不影响；新会话武装时
#   继承最近保存的偏好与最近一次经二级菜单配置的模型链模板（doc.chainTemplate）。
- insert:
    - id: dual-agent
      name: './entry-v21.js'
      config:
        # 状态落盘位置；null/省略 = $DSH_HOME/dual-agent.json（v3 形状：sessions +
        # settings + chains；旧的 v2 文件可直接读，缺的字段首次写入时补齐）
        stateFile: null
        # 主智能行为约束（使能后生效；二级菜单里也能改，改了落盘）
        guidance:
          enforce: true          # 拒绝主会话亲自调用受限工具（子代理不受影响）
          mode: strict           # strict=只判断派活；readonly=另允许 read/grep/glob 等回看
          hideMainTools: false   # 更狠：从主智能清单里隐藏（自检发现伤子代理会自动降级）
          extraAllowed: []       # 额外放行的工具名
        # 出处程序核验（确定性代码，不经模型）
        verify:
          enabled: true          # 总开关：关了就只转原文，不核出处
          requireEvidence: true  # 报告没给证据块 → 明说「无出处」，不默认采信
          urlChecks: false       # 联网核对 url 类出处（默认关：要用户明确同意）
          delegation: true       # 主智能自己用 subagent/workflow 派的活也核
          maxClaims: 40          # 单份报告最多核这么多条（超出如实说明）
          readLimitBytes: 262144 # 单文件读取上限（超上限判无法核验，不猜内容）
          timeoutMs: 8000        # url 核验超时
        # 子代理模型链
        models:
          applyChain: true       # 使能时才改子代理路由；关掉=沿用父会话模型
        # 诊断/沙箱：新会话一出生就武装（headless E2E 用，正式使用请保持 false）
        autoArmForNewSessions: false
