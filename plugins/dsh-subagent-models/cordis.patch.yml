# dsh-subagent-models bundle patch：把插件行插进 profile 组合树。
# 作为 profile 的一层补丁应用在 dsh-base / dsh-web-app 之后。
# 行 id（subagent-models）同时是 Config 页面里的设置分组键。
#
# name 是 package.json 的包名：loader 按包名从 profile 的 node_modules 解析
# （install_bundle 的本地路径 / link: / git 装配都走这条路），入口取 main。
- insert:
    - id: subagent-models
      name: 'dsh-subagent-models'
